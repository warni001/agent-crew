# GHCR push rule: the crew's fine-grained PAT is Actions read-only and has
# no Packages permission, so it can never push an image. This workflow pushes
# with GITHUB_TOKEN only (permissions: packages: write below) — never the
# crew PAT, and never a direct `docker push` from a machine.
#
# The package is public because the repo is public (GHCR images inherit
# the repo's visibility), so the Container App can pull it anonymously.

name: Build and push crew image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — the default writes the workflow's
      # short-lived GITHUB_TOKEN into .git/config as http.extraheader,
      # and the Docker build copies .git/ into the image. Git then
      # sends that dead token on every request and never consults the
      # credential helper, so the crew's PAT never gets used and no PR
      # can ever open. The build needs no git credentials.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Layer cache: hosted runners are fresh VMs, so without this
          # every build reinstalls everything from scratch (~2.5 min).
          # The Actions cache keeps unchanged layers between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Immutable tag per commit, and nothing else: `:latest` is
          # not pushed at all. Deploys must use the sha tag — updating
          # with an unchanged `:latest` string creates no new
          # Container Apps revision, and a `:latest` pull can resolve
          # to a stale cached manifest. A sha tag can only ever point
          # at one digest, so both problems go away. The smoke test
          # below pins the same sha tag for the same reason: testing
          # `:latest` could test a stale image.
          tags: |
            ghcr.io/warni001/agent-crew:sha-${{ github.sha }}

      # A missing tool used to ship silently (gh, git, pytest were all
      # absent from the image) and only fail in Azure. Fail here instead.
      - name: Smoke test the image
        run: |
          docker run --rm ghcr.io/warni001/agent-crew:sha-${{ github.sha }} which gh git pytest
          docker run --rm ghcr.io/warni001/agent-crew:sha-${{ github.sha }} python -m crew --help

  # Auto-deploy: a push to main deploys itself, so nobody has to run
  # `az containerapp update` by hand — the running crew would otherwise
  # keep running stale code while the repo moved on (self-building
  # write-only). Guards, in order: the image build above must pass,
  # the CI run for this commit must conclude success, the sha-tagged
  # manifest must resolve, and the new revision must report ready.
  # Deploys serialize (concurrency, no cancel) so two pushes deploy
  # in order instead of racing. A deploy restarts the container: an
  # in-flight task restarts, but finished work is never re-run (the
  # "[crew] Done:" issue guard), so the cost is lost in-flight
  # progress, not duplicated work.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-container-app
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      # The `gh` CLI resolves the repo from the checkout; without this
      # step it fails with "not a git repository" (first live deploy
      # run, 2026-11-19). No credentials are persisted into
      # .git/config: see the build job's checkout note.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CI runs in a separate workflow, so wait for its run for this
          # commit to conclude — deploy nothing on a red or missing CI.
          for _ in $(seq 1 40); do
            RUN_JSON=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] // empty')
            if [ -n "$RUN_JSON" ]; then
              STATUS=$(echo "$RUN_JSON" | jq -r .status)
              CONCLUSION=$(echo "$RUN_JSON" | jq -r .conclusion)
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCLUSION" = "success" ] || { echo "CI concluded: $CONCLUSION — not deploying."; exit 1; }
                echo "CI passed for $GITHUB_SHA."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "CI did not conclude within 10 minutes — not deploying."
          exit 1

      - name: Verify the sha-tagged image exists
        run: docker buildx imagetools inspect ghcr.io/warni001/agent-crew:sha-${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_DEPLOY_CREDENTIALS }}

      # The rollback step needs the revision that is good now, before
      # the update mints a new one. If the new revision crash-loops
      # or goes silent, the watch step reactivates this one.
      - name: Record the last good revision
        id: last-good
        run: |
          PREVIOUS=$(az containerapp show -g rg-agent-crew -n ca-agent-crew --query properties.latestReadyRevisionName -o tsv)
          echo "revision=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Last good revision: $PREVIOUS"

      - name: Update the Container App
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          az containerapp update -g rg-agent-crew -n ca-agent-crew \
            --image ghcr.io/warni001/agent-crew:sha-"$GITHUB_SHA" \
            --revision-suffix deploy-"$SHORT_SHA"

      - name: Verify the new revision is ready
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          EXPECTED="ca-agent-crew--deploy-$SHORT_SHA"
          for _ in $(seq 1 30); do
            READY=$(az containerapp show -g rg-agent-crew -n ca-agent-crew --query properties.latestReadyRevisionName -o tsv)
            if [ "$READY" = "$EXPECTED" ]; then
              echo "Revision $EXPECTED is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Revision $EXPECTED never became ready (latest ready: $READY)."
          exit 1

      # A bad change that passes tests still ships, and the loop is the
      # thing that broke — so it cannot repair itself. Watch the new
      # revision: a running replica plus a ledger heartbeat within 10
      # minutes means healthy. A crash-loop or silence reactivates the
      # last good revision, deactivates the new one, and fails this
      # job loudly (exit 1) so the rollback is visible, not silent.
      # Exit 2 (cannot verify, e.g. the deploy SP has no Storage Blob
      # Data Reader yet) also fails the job, but rolls nothing back.
      - name: Watch the new revision, roll back if unhealthy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          python3 scripts/rollback_watch.py \
            --new-revision "ca-agent-crew--deploy-$SHORT_SHA" \
            --previous-revision "${{ steps.last-good.outputs.revision }}"
