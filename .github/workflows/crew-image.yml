# GHCR push rule: the crew's fine-grained PAT is Actions read-only and has
# no Packages permission, so it can never push an image. This workflow pushes
# with GITHUB_TOKEN only (permissions: packages: write below) — never the
# crew PAT, and never a direct `docker push` from a machine.
#
# The package is public because the repo is public (GHCR images inherit
# the repo's visibility), so the Container App can pull it anonymously.

name: Build and push crew image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Immutable tag per commit, plus latest for convenience. Deploys
          # must use the sha tag: updating with an unchanged `:latest`
          # string creates no new Container Apps revision, and a `:latest`
          # pull can resolve to a stale cached manifest. A sha tag can
          # only ever point at one digest, so both problems go away.
          tags: |
            ghcr.io/warni001/agent-crew:latest
            ghcr.io/warni001/agent-crew:sha-${{ github.sha }}

      # A missing tool used to ship silently (gh, git, pytest were all
      # absent from the image) and only fail in Azure. Fail here instead.
      - name: Smoke test the image
        run: |
          docker run --rm ghcr.io/warni001/agent-crew:latest which gh git pytest
          docker run --rm ghcr.io/warni001/agent-crew:latest python -m crew --help

  # Auto-deploy: a push to main deploys itself, so nobody has to run
  # `az containerapp update` by hand — the running crew would otherwise
  # keep running stale code while the repo moved on (self-building
  # write-only). Guards, in order: the image build above must pass,
  # the CI run for this commit must conclude success, the sha-tagged
  # manifest must resolve, and the new revision must report ready.
  # Deploys serialize (concurrency, no cancel) so two pushes deploy
  # in order instead of racing. A deploy restarts the container: an
  # in-flight task restarts, but finished work is never re-run (the
  # "[crew] Done:" issue guard), so the cost is lost in-flight
  # progress, not duplicated work.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-container-app
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CI runs in a separate workflow, so wait for its run for this
          # commit to conclude — deploy nothing on a red or missing CI.
          for _ in $(seq 1 40); do
            RUN_JSON=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] // empty')
            if [ -n "$RUN_JSON" ]; then
              STATUS=$(echo "$RUN_JSON" | jq -r .status)
              CONCLUSION=$(echo "$RUN_JSON" | jq -r .conclusion)
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCLUSION" = "success" ] || { echo "CI concluded: $CONCLUSION — not deploying."; exit 1; }
                echo "CI passed for $GITHUB_SHA."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "CI did not conclude within 10 minutes — not deploying."
          exit 1

      - name: Verify the sha-tagged image exists
        run: docker buildx imagetools inspect ghcr.io/warni001/agent-crew:sha-${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_DEPLOY_CREDENTIALS }}

      - name: Update the Container App
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          az containerapp update -g rg-agent-crew -n ca-agent-crew \
            --image ghcr.io/warni001/agent-crew:sha-"$GITHUB_SHA" \
            --revision-suffix deploy-"$SHORT_SHA"

      - name: Verify the new revision is ready
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          EXPECTED="ca-agent-crew--deploy-$SHORT_SHA"
          for _ in $(seq 1 30); do
            READY=$(az containerapp show -g rg-agent-crew -n ca-agent-crew --query properties.latestReadyRevisionName -o tsv)
            if [ "$READY" = "$EXPECTED" ]; then
              echo "Revision $EXPECTED is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Revision $EXPECTED never became ready (latest ready: $READY)."
          exit 1
