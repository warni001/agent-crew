# GHCR push rule: the crew's fine-grained PAT is Actions read-only and has
# no Packages permission, so it can never push an image. This workflow pushes
# with GITHUB_TOKEN only (permissions: packages: write below) — never the
# crew PAT, and never a direct `docker push` from a machine.
#
# The package is public because the repo is public (GHCR images inherit
# the repo's visibility), so the Container App can pull it anonymously.

name: Build and push crew image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Immutable tag per commit, plus latest for convenience. Deploys
          # must use the sha tag: updating with an unchanged `:latest`
          # string creates no new Container Apps revision, and a `:latest`
          # pull can resolve to a stale cached manifest. A sha tag can
          # only ever point at one digest, so both problems go away.
          tags: |
            ghcr.io/warni001/agent-crew:latest
            ghcr.io/warni001/agent-crew:sha-${{ github.sha }}

      # A missing tool used to ship silently (gh, git, pytest were all
      # absent from the image) and only fail in Azure. Fail here instead.
      - name: Smoke test the image
        run: |
          docker run --rm ghcr.io/warni001/agent-crew:latest which gh git pytest
          docker run --rm ghcr.io/warni001/agent-crew:latest python -m crew --help
