# GHCR push rule: the crew's fine-grained PAT is Actions read-only and has
# no Packages permission, so it can never push an image. This workflow pushes
# with GITHUB_TOKEN only (permissions: packages: write below) — never the
# crew PAT, and never a direct `docker push` from a machine.
#
# After the first push, make the package public in the GHCR package settings
# so the Container App can pull it anonymously.

name: Build and push crew image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/warni001/agent-crew:latest
